<script>
/**
 * MODULE: QUẢN LÝ TIÊU CHÍ ĐÁNH GIÁ GIÁO VIÊN CẤP 2 VÙNG CAO
 */
(function() {
    if (document.getElementById('tieuchi-gvc2vc-ui')) return;

    const style = document.createElement('style');
    style.textContent = `
        #tieuchi-gvc2vc-ui { display: none; margin-top: 0px; background: white; padding: 0px 20px 15px 20px; border-radius: 5px; box-sizing: border-box; overflow-y: visible; }
        .tcvc2-header-sticky { position: sticky; top: 77px; background: #fff; z-index: 990; padding-top: 5px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 2px solid red; }
        .tcvc2-tieu-de { color: var(--mau-c); text-transform: uppercase; text-align: center; margin: 0 0 10px 0; padding: 0; font-size: 20px; font-weight: bold; }
        .tcvc2-hanh-dong { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .tcvc2-nam-hoc { display: flex; align-items: center; gap: 8px; background: #f1f3f5; padding: 5px 12px; border-radius: 6px; }
        .tcvc2-nam-hoc label { font-weight: bold; color: var(--mau-c); margin: 0; }
        .tcvc2-nam-hoc input { border: 1px solid #ccc; border-radius: 4px; padding: 6px 10px; font-family: inherit; width: 130px; text-align: center; }
        
        .table-tieuchi-vc2 { width: 100%; border-collapse: collapse; margin-top: 0; }
        .table-tieuchi-vc2 th, .table-tieuchi-vc2 td { border: 1px solid #dee2e6; padding: 8px 10px; vertical-align: middle; }
        .table-tieuchi-vc2 th { background: #e9ecef; color: var(--mau-c); font-size: 15px; font-weight: bold; text-align: center; }
        .table-tieuchi-vc2 td { text-align: left; }
        
        .table-tieuchi-vc2 textarea { width: 100%; border: none; outline: none; background: transparent; font-family: inherit; font-size: 14px; line-height: 1.4; padding: 4px 0; margin: 0; resize: none; overflow: hidden !important; box-sizing: border-box; height: auto; min-height: 38px; scrollbar-width: none !important; }
        .table-tieuchi-vc2 textarea:focus { background: #fef9e6; }
        
        .td-buttons-vc2 { text-align: center; white-space: nowrap; width: 50px; }
        .btn-di-chuyen-vc2, .btn-xoa-dong-vc2 { display: block; width: 100%; margin: 4px 0; padding: 6px 0; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; text-align: center; }
        .btn-di-chuyen-vc2 { background: #6c757d; color: white; }
        .btn-di-chuyen-vc2:hover { background: #5a6268; }
        .btn-xoa-dong-vc2 { background: #dc3545; color: white; }
        .btn-xoa-dong-vc2:hover { background: #c82333; }
        
        .btn-them-moi-vc2 { background: #28a745; color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.2s; }
        .btn-them-moi-vc2:hover { background: #218838; }
        .btn-cap-nhat-vc2 { background: var(--mau-c); color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.2s; }
        .btn-cap-nhat-vc2:hover { background: #004494; transform: translateY(-1px); }
    `;
    document.head.appendChild(style);

    const tieuchiHTML = `
        <div id="tieuchi-gvc2vc-ui">
            <div class="tcvc2-header-sticky">
                <h3 class="tcvc2-tieu-de">TIÊU CHÍ ĐÁNH GIÁ GIÁO VIÊN C2 VÙNG CAO</h3>
                <div class="tcvc2-hanh-dong">
                    <div class="tcvc2-nam-hoc">
                        <label>📅 Năm học:</label>
                        <input type="text" id="tcgvc2vc-namhoc" placeholder="VD: 2025-2026" value="">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-them-moi-vc2" onclick="tcgvc2vc_ThemDong()">+ Thêm mới</button>
                        <button class="btn-cap-nhat-vc2" onclick="tcgvc2vc_LuuCapNhat()">CẬP NHẬT (LƯU THAY ĐỔI)</button>
                    </div>
                </div>
            </div>
            <div style="overflow-x: auto; overflow-y: visible;">
                <table class="table-tieuchi-vc2">
                    <thead>
                        <tr><th width="7%">Sửa</th><th width="5%">TT</th><th width="28%">Tiêu chí</th><th width="10%">Thang giá trị</th><th width="8%">Quy điểm</th><th width="8%">Xuất sắc</th><th width="8%">HTT</th><th width="8%">Hoàn thành</th><th width="7%">CHT</th></tr>
                    </thead>
                    <tbody id="tcgvc2vc-tbody"></tbody>
                </table>
            </div>
        </div>
    `;
    const mainUi = document.getElementById('main-ui');
    if (mainUi) mainUi.insertAdjacentHTML('beforeend', tieuchiHTML);

    const uiNode = document.getElementById('tieuchi-gvc2vc-ui');
    if (uiNode) {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.attributeName === 'style') {
                    const isVisible = uiNode.style.display === 'block';
                    const kDau = document.querySelector('.k-dau');
                    const sysHeader = document.querySelector('.k-header-sticky');
                    const tcHeader = document.querySelector('.tcvc2-header-sticky');
                    if (isVisible) {
                        if (kDau) { kDau.style.borderBottom = 'none'; kDau.style.paddingBottom = '0px'; kDau.style.marginBottom = '0px'; }
                        if (sysHeader && tcHeader) tcHeader.style.top = sysHeader.offsetHeight + 'px';
                    } else {
                        if (kDau) { kDau.style.borderBottom = ''; kDau.style.paddingBottom = ''; kDau.style.marginBottom = ''; }
                    }
                }
            });
        });
        observer.observe(uiNode, { attributes: true });
    }
})();

var tcgvc2vc_DuLieuGoc = [];
var tcgvc2vc_NamHocGoc = "";

async function tcgvc2vc_TaiDuLieu() {
    if (tcgvc2vc_DuLieuGoc && tcgvc2vc_DuLieuGoc.length > 0) {
        tcgvc2vc_HienThiBang();
        return;
    }

    if (typeof f_x_j === 'function') f_x_j(true);
    try {
        const gasUrl = (typeof DG_CONFIG_GAS_URL !== 'undefined') ? DG_CONFIG_GAS_URL : "";
        const response = await fetchAPI(gasUrl + "?z_p_a=get_tieuchi_gvc2vc");
        if (response.status === 'success') {
            tcgvc2vc_DuLieuGoc = response.data || [];
            if (response.nam_hoc !== undefined && response.nam_hoc !== null) {
                tcgvc2vc_NamHocGoc = response.nam_hoc;
                const inpNam = document.getElementById('tcgvc2vc-namhoc');
                if (inpNam) inpNam.value = response.nam_hoc;
            }
            tcgvc2vc_HienThiBang();
        } else {
            hienThiThongBaoUI("Lỗi tải tiêu chí: " + (response.message || "Không xác định"));
        }
    } catch (err) {
        hienThiThongBaoUI("Mất kết nối khi tải danh sách tiêu chí.");
    }
    if (typeof f_x_j === 'function') f_x_j(false);
}

function tcgvc2vc_HienThiBang() {
    const tbody = document.getElementById('tcgvc2vc-tbody');
    if (!tbody) return;
    tbody.innerHTML = '';
    tcgvc2vc_DuLieuGoc.forEach((item, idx) => {
        tbody.insertAdjacentHTML('beforeend', tcgvc2vc_TaoDong(idx, item));
    });
    if (typeof f_x_auto_resize_textarea === 'function') f_x_auto_resize_textarea('tcgvc2vc-tbody');
}

function tcgvc2vc_TaoDong(index, item) {
    const tieu_chi = escapeHtml_vc(item.tieu_chi || '');
    const thang_gia_tri = escapeHtml_vc(item.thang_gia_tri || '');
    const quy_diem = escapeHtml_vc(item.quy_diem || '');
    const xuat_sac = escapeHtml_vc(item.xuat_sac || '');
    const htt = escapeHtml_vc(item.htt || '');
    const hoan_thanh = escapeHtml_vc(item.hoan_thanh || '');
    const cht = escapeHtml_vc(item.cht || '');
    
    return `<tr>
        <td class="td-buttons-vc2">
            <button class="btn-di-chuyen-vc2" onclick="tcgvc2vc_DiChuyen(this, 'up')" title="Di chuyển lên">▲</button>
            <button class="btn-xoa-dong-vc2" onclick="tcgvc2vc_XoaDong(this)">Xóa</button>
            <button class="btn-di-chuyen-vc2" onclick="tcgvc2vc_DiChuyen(this, 'down')" title="Di chuyển xuống">▼</button>
        </td>
        <td class="tcgvc2vc-stt" style="text-align:center">${index+1}</td>
        <td><textarea class="tcgvc2vc-tieuchi" rows="1" placeholder="Nhập tiêu chí">${tieu_chi}</textarea></td>
        <td><textarea class="tcgvc2vc-thang" rows="1" placeholder="VD: 0-10">${thang_gia_tri}</textarea></td>
        <td><textarea class="tcgvc2vc-quydiem" rows="1" placeholder="Điểm tối đa">${quy_diem}</textarea></td>
        <td><textarea class="tcgvc2vc-xuatsac" rows="1" placeholder="Mức xuất sắc">${xuat_sac}</textarea></td>
        <td><textarea class="tcgvc2vc-htt" rows="1" placeholder="HTT">${htt}</textarea></td>
        <td><textarea class="tcgvc2vc-hoanthanh" rows="1" placeholder="Hoàn thành">${hoan_thanh}</textarea></td>
        <td><textarea class="tcgvc2vc-cht" rows="1" placeholder="CHT">${cht}</textarea></td>
    </tr>`;
}

function tcgvc2vc_DiChuyen(btn, direction) {
    const row = btn.closest('tr');
    const tbody = row.parentNode;
    const rows = Array.from(tbody.children);
    const currentIndex = rows.indexOf(row);
    
    if (direction === 'up' && currentIndex > 0) {
        tbody.insertBefore(row, rows[currentIndex - 1]);
    } else if (direction === 'down' && currentIndex < rows.length - 1) {
        tbody.insertBefore(row, rows[currentIndex + 2]);
    } else {
        return;
    }
    tcgvc2vc_CapNhatSTT();
    if (typeof f_x_auto_resize_textarea === 'function') f_x_auto_resize_textarea('tcgvc2vc-tbody');
}

function tcgvc2vc_ThemDong() {
    const tbody = document.getElementById('tcgvc2vc-tbody');
    const emptyItem = { tieu_chi: '', thang_gia_tri: '', quy_diem: '', xuat_sac: '', htt: '', hoan_thanh: '', cht: '' };
    tbody.insertAdjacentHTML('afterbegin', tcgvc2vc_TaoDong(0, emptyItem));
    tcgvc2vc_CapNhatSTT();
    if (typeof f_x_auto_resize_textarea === 'function') f_x_auto_resize_textarea('tcgvc2vc-tbody');
}

function tcgvc2vc_XoaDong(btn) {
    if (confirm("Xóa tiêu chí này khỏi danh sách?")) {
        btn.closest('tr').remove();
        tcgvc2vc_CapNhatSTT();
        if (typeof f_x_auto_resize_textarea === 'function') f_x_auto_resize_textarea('tcgvc2vc-tbody');
    }
}

function tcgvc2vc_CapNhatSTT() {
    const tbody = document.getElementById('tcgvc2vc-tbody');
    if (!tbody) return;
    Array.from(tbody.children).forEach((tr, idx) => {
        const sttCell = tr.querySelector('.tcgvc2vc-stt');
        if (sttCell) sttCell.innerText = idx + 1;
    });
}

async function tcgvc2vc_LuuCapNhat() {
    const tbody = document.getElementById('tcgvc2vc-tbody');
    const newData = [];
    
    Array.from(tbody.children).forEach(tr => {
        const tieu_chi = tr.querySelector('.tcgvc2vc-tieuchi')?.value.trim() || '';
        if (tieu_chi !== '') {
            newData.push({
                tieu_chi: tieu_chi,
                thang_gia_tri: tr.querySelector('.tcgvc2vc-thang')?.value.trim() || '',
                quy_diem: tr.querySelector('.tcgvc2vc-quydiem')?.value.trim() || '',
                xuat_sac: tr.querySelector('.tcgvc2vc-xuatsac')?.value.trim() || '',
                htt: tr.querySelector('.tcgvc2vc-htt')?.value.trim() || '',
                hoan_thanh: tr.querySelector('.tcgvc2vc-hoanthanh')?.value.trim() || '',
                cht: tr.querySelector('.tcgvc2vc-cht')?.value.trim() || ''
            });
        }
    });
    
    const namHocMoi = document.getElementById('tcgvc2vc-namhoc')?.value.trim() || '';
    const dataChanged = JSON.stringify(tcgvc2vc_DuLieuGoc) !== JSON.stringify(newData);
    const yearChanged = tcgvc2vc_NamHocGoc !== namHocMoi;
    
    if (!dataChanged && !yearChanged) {
        hienThiThongBaoUI("Không có thay đổi nào để lưu.");
        return;
    }
    
    const overlay = document.getElementById("o-luu-overlay");
    if (overlay) overlay.style.display = "flex";
    try {
        const gasUrl = (typeof DG_CONFIG_GAS_URL !== 'undefined') ? DG_CONFIG_GAS_URL : "";
        await fetch(gasUrl, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ 
                action: 'luu_tieuchi_gvc2vc', 
                data: newData,
                nam_hoc: namHocMoi
            })
        });
        setTimeout(() => {
            if (overlay) overlay.style.display = "none";
            tcgvc2vc_ThongBaoThanhCong("Đã cập nhật bảng tiêu chí C2 Vùng cao thành công!");
            tcgvc2vc_DuLieuGoc = []; 
            tcgvc2vc_TaiDuLieu();
        }, 1500);
    } catch (err) {
        if (overlay) overlay.style.display = "none";
        hienThiThongBaoUI("Lỗi kết nối khi lưu dữ liệu. Vui lòng thử lại.");
    }
}

function tcgvc2vc_ThongBaoThanhCong(noiDung) {
    const hopThongBao = document.getElementById("o-thong-bao");
    if (hopThongBao) {
        const divs = hopThongBao.getElementsByTagName("div");
        const nutXacNhan = hopThongBao.getElementsByTagName("button")[0];
        if (divs.length >= 2 && nutXacNhan) {
            const tieuDeGoc = divs[0].innerHTML;
            const noiDungGoc = divs[1].innerHTML;
            const hamDongGoc = nutXacNhan.onclick;
            divs[0].innerHTML = "CẬP NHẬT THÀNH CÔNG";
            divs[1].innerHTML = noiDung;
            hopThongBao.style.display = "flex";
            nutXacNhan.onclick = function() {
                hopThongBao.style.display = "none";
                divs[0].innerHTML = tieuDeGoc;
                divs[1].innerHTML = noiDungGoc;
                nutXacNhan.onclick = hamDongGoc;
            };
        }
    } else {
        alert(noiDung);
    }
}

if (typeof window.tcgvc2vc_TaiDuLieu === 'undefined') {
    window.tcgvc2vc_TaiDuLieu = tcgvc2vc_TaiDuLieu;
    window.tcgvc2vc_ThemDong = tcgvc2vc_ThemDong;
    window.tcgvc2vc_XoaDong = tcgvc2vc_XoaDong;
    window.tcgvc2vc_LuuCapNhat = tcgvc2vc_LuuCapNhat;
}
</script>
